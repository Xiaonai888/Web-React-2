<!DOCTYPE html>

  <meta charset="UTF-8" />
  <meta id="shadow-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script>
  const setShadowViewport = () => {
    const phone = Math.min(screen.width, screen.height) <= 600
    const landscape = matchMedia('(orientation: landscape)').matches
    document.getElementById('shadow-viewport').content =
      phone && landscape ? 'width=1024, viewport-fit=cover' : 'width=device-width, initial-scale=1.0, viewport-fit=cover'
  }
  setShadowViewport()
  addEventListener('orientationchange', () => setTimeout(setShadowViewport, 100))
</script>

  <script>
    try {
      const theme = localStorage.getItem('shadow_theme') === 'dark' ? 'dark' : 'light'
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.style.colorScheme = theme
    } catch {
      document.documentElement.classList.remove('dark')
      document.documentElement.style.colorScheme = 'light'
    }

  <script>
  ;(() => {
    if (window.__shadowErrorDiagnosticsInstalled) return
    window.__shadowErrorDiagnosticsInstalled = true

    const reports = []
    let lastDisplayedSignature = ''
    let lastDisplayedAt = 0
    let popup = null
    let passiveNotice = null
    const trackedFetchFailures = new WeakSet()

    const scrub = (value, max = 1200) => String(value ?? '')
      .replace(/\bBearer\s+[A-Za-z0-9._~+\/-]+/gi, 'Bearer [REDACTED]')
      .replace(/([?&](?:access_token|refresh_token|token|api_key|apikey|secret|password|code|key)=)[^&#\s]+/gi, '$1[REDACTED]')
      .replace(/\b(?:access_token|refresh_token|api_key|apikey|authorization|password|secret)\s*[:=]\s*[^\s,;}]+/gi, '[REDACTED_FIELD]')
      .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[EMAIL]')
      .replace(/\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)?\b/g, '[JWT]')
      .slice(0, max)

    const safePath = (url) => {
      try {
        const parsed = new URL(String(url), location.origin)
        return parsed.pathname.slice(0, 200)
      } catch {
        return '[unknown path]'
      }
    }

    const deviceInfo = () => {
      const ua = navigator.userAgent || ''
      const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      const os = ios ? 'iOS / iPadOS' : /Android/i.test(ua) ? 'Android' : /Windows/i.test(ua) ? 'Windows' : /Macintosh|Mac OS X/i.test(ua) ? 'macOS' : /Linux/i.test(ua) ? 'Linux' : 'Unknown'
      const browser = /EdgA?|EdgiOS/i.test(ua) ? 'Edge' : /SamsungBrowser/i.test(ua) ? 'Samsung Internet' : /FxiOS|Firefox/i.test(ua) ? 'Firefox' : /CriOS|Chrome/i.test(ua) ? 'Chrome' : /Safari/i.test(ua) ? 'Safari' : 'Unknown browser / WebView'
      const installed = Boolean(navigator.standalone || window.matchMedia?.('(display-mode: standalone)')?.matches)
      const webview = /; wv\)|\bwv\b/i.test(ua) || (ios && !/Safari/i.test(ua))
      return {
        os,
        browser,
        appMode: installed ? 'Installed PWA' : webview ? 'Possible WebView' : 'Browser',
        userAgent: scrub(ua, 350),
        language: navigator.language || 'unknown',
        online: navigator.onLine,
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        deviceMemoryGB: Number.isFinite(navigator.deviceMemory) ? navigator.deviceMemory : 'not exposed',
      }
    }

    const safeContext = (context) => {
      const allowed = ['stage', 'action', 'operation', 'status', 'method', 'fileType', 'fileSize', 'imageWidth', 'imageHeight', 'outputWidth', 'outputHeight', 'imageSource', 'attempt', 'requestHost', 'requestPath']
      const result = {}
      if (!context || typeof context !== 'object') return result
      for (const key of allowed) {
        const value = context[key]
        if (typeof value === 'number' && Number.isFinite(value)) result[key] = value
        if (typeof value === 'boolean') result[key] = value
        if (typeof value === 'string') result[key] = scrub(value, 150)
      }
      return result
    }

    const classify = (name, message, kind, context) => {
      const value = `${name} ${message}`
      const status = Number(context.status || 0)
      if (navigator.onLine === false) return { code: 'OFFLINE', possibleCause: 'The device reports that it is offline.', confidence: 'Observed device state' }
      if (kind === 'http') {
        const causes = {
          408: 'The HTTP request timed out.',
          413: 'The server or gateway rejected the request size.',
          415: 'The server rejected the media/content type.',
          422: 'The server rejected the submitted data.',
          429: 'The server or gateway is rate-limiting requests.',
          500: 'The server reported an internal error.',
          502: 'A gateway returned an invalid upstream response.',
          503: 'The server or gateway reported temporary unavailability.',
          504: 'A gateway reported an upstream timeout.',
        }
        return { code: `HTTP_${status || 'ERROR'}`, possibleCause: causes[status] || `HTTP request failed with status ${status}.`, confidence: 'Confirmed HTTP status; underlying server cause requires server logs' }
      }
      if (/QuotaExceededError|quota.*exceed|storage.*full/i.test(value)) return { code: 'STORAGE_QUOTA', possibleCause: 'Browser storage quota was exceeded or storage access was denied.', confidence: 'Browser-reported error' }
      if (/SecurityError|tainted canvas|cross.origin.*canvas|cross.origin.*data/i.test(value)) return { code: 'CANVAS_SECURITY', possibleCause: 'The browser blocked canvas access, potentially due to cross-origin image data or security restrictions.', confidence: 'Browser-reported restriction; exact source requires inspection' }
      if (/out of memory|allocation failed|memory exhausted|not enough memory/i.test(value)) return { code: 'MEMORY', possibleCause: 'The browser reported a memory or allocation failure.', confidence: 'Browser-reported error' }
      if (/AbortError|aborted|cancelled|canceled/i.test(value)) return { code: 'ABORTED', possibleCause: 'The operation was cancelled or aborted.', confidence: 'Browser-reported error' }
      if (/IMAGE_DECODE_FAILED|IMAGE_EMPTY_DIMENSIONS/i.test(value)) return { code: 'IMAGE_DECODE', possibleCause: 'The browser could not decode or reopen the image. The underlying file format, image bytes, temporary URL, or memory limit must be checked.', confidence: 'Image load/decode failure observed; exact cause not yet confirmed' }
      if (/NotSupportedError|not supported|unsupported|HEIC|HEIF|AVIF/i.test(value)) return { code: 'UNSUPPORTED_FORMAT', possibleCause: 'The browser or decoder may not support this file format or API.', confidence: 'Likely; verify media type and browser support' }
      if (/Failed to fetch|Load failed|NetworkError|Network request failed/i.test(value)) return { code: 'NETWORK', possibleCause: 'The request failed before an HTTP response was available. DNS, connectivity, CORS, TLS, or server availability are possible causes.', confidence: 'Network failure observed; exact network cause not exposed by browser' }
      if (/ChunkLoadError|dynamically imported module|module script|preload CSS/i.test(value)) return { code: 'APP_ASSET', possibleCause: 'A website JavaScript or CSS asset failed to load. Check deployment version, cache and network.', confidence: 'Likely from error message' }
      if (/decode|EncodingError|InvalidStateError/i.test(value) && /image|crop|canvas|decode/i.test(`${context.stage || ''} ${value}`)) return { code: 'IMAGE_DECODE', possibleCause: 'Image decoding, loading or canvas state failed. A corrupt/unsupported image, browser limits, or invalid dimensions may be involved.', confidence: 'Likely; root cause not confirmed' }
      if (/canvas|toDataURL|drawImage|crop/i.test(`${context.stage || ''} ${value}`)) return { code: 'IMAGE_PROCESSING', possibleCause: 'Image canvas processing failed. Dimensions, source image restrictions, and browser memory limits should be checked.', confidence: 'Stage inferred; root cause not confirmed' }
      if (/TypeError/i.test(name)) return { code: 'TYPE_ERROR', possibleCause: 'A JavaScript operation used an unexpected type or failed API access.', confidence: 'Browser-reported error type' }
      if (/ReferenceError/i.test(name)) return { code: 'REFERENCE_ERROR', possibleCause: 'JavaScript referred to a missing variable or value.', confidence: 'Browser-reported error type' }
      return { code: 'UNCLASSIFIED', possibleCause: 'The browser reported an error, but the root cause cannot yet be determined from this message.', confidence: 'Unknown' }
    }

    const makeCode = (value) => {
      let hash = 2166136261
      for (let i = 0; i < value.length; i += 1) hash = Math.imul(hash ^ value.charCodeAt(i), 16777619)
      return (hash >>> 0).toString(16).toUpperCase().padStart(8, '0')
    }

    const addText = (parent, text, css) => {
      const element = document.createElement('div')
      element.textContent = text
      if (css) element.style.cssText = css
      parent.appendChild(element)
      return element
    }

    const copyText = async (text) => {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable')
        await navigator.clipboard.writeText(text)
        return true
      } catch {
        try {
          const area = document.createElement('textarea')
          area.value = text
          area.style.cssText = 'position:fixed;opacity:0;pointer-events:none;top:0;left:0'
          document.body.appendChild(area)
          area.focus()
          area.select()
          const success = document.execCommand('copy')
          area.remove()
          return success
        } catch {
          return false
        }
      }
    }

    const display = (report) => {
      if (!document.body) {
        document.addEventListener('DOMContentLoaded', () => display(report), { once: true })
        return
      }
      if (popup) popup.remove()
      if (passiveNotice) { passiveNotice.remove(); passiveNotice = null }
      const panel = document.createElement('section')
      popup = panel
      panel.id = 'shadow-global-error-diagnostic'
      panel.setAttribute('role', 'alert')
      panel.style.cssText = 'position:fixed;z-index:2147483647;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 20px));max-height:min(70vh,520px);overflow:auto;box-sizing:border-box;padding:15px;border:1px solid #d1d5db;border-left:4px solid #dc2626;border-radius:15px;background:white;color:#111827;box-shadow:0 10px 35px #0005;font:12px/1.5 system-ui,sans-serif;overflow-wrap:anywhere;text-align:left'
      addText(panel, 'Shadow • Error Diagnostic', 'font-size:15px;font-weight:700;margin-bottom:5px')
      addText(panel, `${report.code} • ${report.kind} • ${report.context.stage || 'unknown stage'}`, 'font-size:11px;color:#9f1239;font-weight:600;margin-bottom:8px')
      if (report.context.requestPath) addText(panel, `Request: ${report.context.method || 'GET'} ${report.context.requestHost || ''}${report.context.requestPath}`, 'font-size:11px;font-weight:600;margin-bottom:8px;white-space:pre-wrap')
      addText(panel, `Observed: ${report.error.name}: ${report.error.message}`, 'font-weight:600;margin-bottom:8px;white-space:pre-wrap')
      addText(panel, `Explanation: ${report.analysis.possibleCause}`, 'margin-bottom:6px')
      addText(panel, `Certainty: ${report.analysis.confidence}`, 'color:#4b5563;margin-bottom:10px')
      const details = document.createElement('details')
      details.style.cssText = 'margin:10px 0;border-top:1px solid #e5e7eb;padding-top:8px'
      const summary = document.createElement('summary')
      summary.textContent = 'Full technical details / ព័ត៌មានលម្អិត'
      summary.style.cssText = 'font-weight:600;cursor:pointer'
      const pre = document.createElement('pre')
      pre.textContent = JSON.stringify(report, null, 2)
      pre.style.cssText = 'margin:10px 0;max-height:190px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;font:11px/1.5 ui-monospace,monospace'
      details.append(summary, pre)
      panel.appendChild(details)
      const actions = document.createElement('div')
      actions.style.cssText = 'display:flex;gap:8px;margin-top:10px'
      const copy = document.createElement('button')
      copy.type = 'button'
      copy.textContent = 'Copy Error Details'
      copy.style.cssText = 'flex:1;padding:10px;background:#111827;border:0;border-radius:9px;color:white;font:600 12px system-ui,sans-serif;cursor:pointer'
      copy.addEventListener('click', async () => {
        const success = await copyText(JSON.stringify(report, null, 2))
        if (!success) {
          details.open = true
          copy.textContent = 'Select details above to copy'
          return
        }
        copy.textContent = 'Copied ✓'
      })
      const close = document.createElement('button')
      close.type = 'button'
      close.textContent = 'Close'
      close.style.cssText = 'padding:10px 15px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:9px;color:#111827;font:600 12px system-ui,sans-serif;cursor:pointer'
      close.addEventListener('click', () => {
        panel.remove()
        if (popup === panel) popup = null
      })
      actions.append(copy, close)
      panel.appendChild(actions)
      document.body.appendChild(panel)
    }

    const showPassive = (report) => {
      if (!document.body) {
        document.addEventListener('DOMContentLoaded', () => showPassive(report), { once: true })
        return
      }
      if (popup) return
      if (passiveNotice) passiveNotice.remove()
      const panel = document.createElement('div')
      panel.id = 'shadow-network-diagnostic-notice'
      panel.style.cssText = 'position:fixed;z-index:2147483646;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:10px;max-width:min(350px,calc(100vw - 20px));display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:#111827;box-shadow:0 5px 20px #0003;font:600 12px system-ui,sans-serif'
      const open = document.createElement('button')
      open.type = 'button'
      open.textContent = `Network issue · ${report.context.requestPath || 'Details'}`
      open.style.cssText = 'max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;color:#111827;padding:5px 9px;font:inherit;cursor:pointer'
      open.addEventListener('click', () => display(report))
      const close = document.createElement('button')
      close.type = 'button'
      close.textContent = '×'
      close.setAttribute('aria-label', 'Dismiss network diagnostic')
      close.style.cssText = 'border:0;border-radius:100%;background:#e5e7eb;color:#111827;width:26px;height:26px;font:600 17px system-ui,sans-serif;cursor:pointer'
      close.addEventListener('click', () => {
        panel.remove()
        if (passiveNotice === panel) passiveNotice = null
      })
      panel.append(open, close)
      document.body.appendChild(panel)
      passiveNotice = panel
    }

    const record = (error, context = {}) => {
      const options = context && typeof context === 'object' ? context : {}
      const name = scrub(error?.name || 'Error', 90)
      const message = scrub(error?.message || (typeof error === 'string' ? error : 'No error message provided'), 650)
      if (name === 'AbortError' && options.force !== true) return null
      const kind = scrub(options.kind || 'operation', 40)
      const safe = safeContext(options)
      const analysis = classify(name, message, kind, safe)
      const signature = `${kind}|${safe.stage || ''}|${name}|${message}|${safe.status || ''}|${safe.requestHost || ''}|${safe.requestPath || ''}|${location.pathname}`
      const now = Date.now()
      const report = {
        code: `SHD-${analysis.code}-${makeCode(signature)}`,
        time: new Date(now).toISOString(),
        kind,
        context: safe,
        error: { name, message, stack: scrub(error?.stack || '', 1300) },
        analysis,
        device: deviceInfo(),
        page: location.pathname.slice(0, 220),
      }
      reports.push(report)
      if (reports.length > 35) reports.shift()
      console.error('SHADOW_ERROR_DIAGNOSTIC', report)
      if (options.action === 'save-crop' && options.show !== false && (signature !== lastDisplayedSignature || now - lastDisplayedAt > 15000)) {
        lastDisplayedSignature = signature
        lastDisplayedAt = now
        if (options.show === 'passive') showPassive(report)
        else display(report)
      }
      return report
    }

    window.ShadowDiagnostics = Object.freeze({
      report: (error, context) => record(error, context),
      last: () => reports[reports.length - 1] || null,
      history: () => reports.slice(),
      showLast: () => {
        const last = reports[reports.length - 1]
        if (last) display(last)
        return last || null
      },
      copyLast: async () => {
        const last = reports[reports.length - 1]
        return last ? copyText(JSON.stringify(last, null, 2)) : false
      },
    })

    const instrumentCanvas = () => {
      const attach = (prototype, method, stage) => {
        const original = prototype?.[method]
        if (typeof original !== 'function') return
        try {
          prototype[method] = function (...args) {
            try {
              const output = original.apply(this, args)
              if (method === 'toDataURL' && (!output || output === 'data:,')) {
                record(new Error('Canvas export returned an empty data URL. The canvas may exceed browser limits or have invalid dimensions.'), {
                  kind: 'image', stage, outputWidth: this.width, outputHeight: this.height,
                })
              }
              if (method === 'getContext' && args[0] === '2d' && output === null) {
                record(new Error('Canvas 2D context is unavailable. The browser may have exhausted available graphics resources.'), {
                  kind: 'image', stage: 'canvas-context', outputWidth: this.width, outputHeight: this.height,
                })
              }
              return output
            } catch (error) {
              record(error, {
                kind: 'image', stage,
                outputWidth: Number(this?.canvas?.width || this?.width || 0),
                outputHeight: Number(this?.canvas?.height || this?.height || 0),
              })
              throw error
            }
          }
        } catch {}
      }

      if (typeof HTMLCanvasElement !== 'undefined') {
        attach(HTMLCanvasElement.prototype, 'toDataURL', 'canvas-export')
        attach(HTMLCanvasElement.prototype, 'getContext', 'canvas-context')
        const originalToBlob = HTMLCanvasElement.prototype.toBlob
        if (typeof originalToBlob === 'function') {
          try {
            HTMLCanvasElement.prototype.toBlob = function (callback, ...options) {
              try {
                return originalToBlob.call(this, (blob) => {
                  if (!blob) record(new Error('Canvas toBlob returned null. The browser could not encode the image.'), {
                    kind: 'image', stage: 'canvas-blob-export',
                    outputWidth: this.width, outputHeight: this.height,
                  })
                  if (typeof callback === 'function') callback(blob)
                }, ...options)
              } catch (error) {
                record(error, {
                  kind: 'image', stage: 'canvas-blob-export',
                  outputWidth: this.width, outputHeight: this.height,
                })
                throw error
              }
            }
          } catch {}
        }
      }

      if (typeof CanvasRenderingContext2D !== 'undefined') {
        attach(CanvasRenderingContext2D.prototype, 'drawImage', 'canvas-draw')
      }
      if (typeof OffscreenCanvas !== 'undefined') {
        attach(OffscreenCanvas.prototype, 'convertToBlob', 'offscreen-canvas-export')
      }
    }

    instrumentCanvas()

    document.addEventListener('error', (event) => {
      const image = event.target
      if (image?.tagName !== 'IMG') return
      const classes = typeof image.className === 'string' ? image.className : ''
      if (!/reactEasyCrop/i.test(classes)) return
      let source = 'unknown'
      try {
        source = new URL(image.currentSrc || image.src).protocol.replace(':', '')
      } catch {}
      record(new Error('Image preview failed to load or decode. Check file type, damaged image data, browser support and memory limits.'), {
        kind: 'image', stage: 'crop-image-load', imageSource: source,
        imageWidth: Number(image.naturalWidth || 0), imageHeight: Number(image.naturalHeight || 0),
      })
    }, true)

    window.addEventListener('error', (event) => {
      if (event.target && event.target !== window) return
      record(event.error || new Error(event.message || 'Unknown runtime error'), { kind: 'javascript', stage: 'runtime' })
    }, true)

    window.addEventListener('unhandledrejection', (event) => {
      const error = event.reason instanceof Error ? event.reason : new Error(scrub(event.reason || 'Unhandled promise rejection'))
      if (trackedFetchFailures.has(error)) return
      record(error, { kind: 'promise', stage: 'unhandled-promise' })
    })

    document.addEventListener('error', (event) => {
      const target = event.target
      if (!target || !['SCRIPT', 'LINK'].includes(target.tagName)) return
      const source = target.src || target.href || ''
      record(new Error(`${target.tagName} resource failed to load: ${safePath(source)}`), { kind: 'resource', stage: 'asset-load' })
    }, true)

    const originalFetch = window.fetch
    if (typeof originalFetch === 'function') {
      window.fetch = function shadowDiagnosticFetch(...args) {
        let url = null
        let method = 'GET'
        let monitor = false
        try {
          const input = args[0]
          url = new URL(input instanceof Request ? input.url : String(input), location.origin)
          method = String(args[1]?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase()
          monitor = url.origin === location.origin || url.hostname === 'shadow-backend-kucw.onrender.com' || /(?:^|\.)shadowerabook\.site$/i.test(url.hostname)
        } catch {}
        let pending
        try {
          pending = originalFetch.apply(this, args)
        } catch (error) {
          if (monitor) record(error, { kind: 'network', stage: 'fetch-call', method, requestHost: url?.hostname || '', requestPath: url ? safePath(url) : '', show: method === 'GET' ? 'passive' : true })
          throw error
        }
        if (!monitor || !pending || typeof pending.then !== 'function') return pending
        return pending.then((response) => {
          if ([408, 413, 415, 422, 429].includes(response.status) || response.status >= 500) {
            record(new Error(`HTTP ${response.status} ${response.statusText || ''} on ${method} ${safePath(url)}`), {
              kind: 'http', stage: 'http-response', method, status: response.status, requestHost: url.hostname, requestPath: safePath(url), show: method === 'GET' ? 'passive' : true,
            })
          }
          return response
        }, (error) => {
          if (error?.name !== 'AbortError') {
            if (error && typeof error === 'object') trackedFetchFailures.add(error)
            record(error, { kind: 'network', stage: 'fetch-request', method, requestHost: url.hostname, requestPath: safePath(url), show: method === 'GET' ? 'passive' : true })
          }
          throw error
        })
      }
    }
  })()
  </script>

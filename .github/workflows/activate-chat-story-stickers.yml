name: Activate Chat Story Stickers Web

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-chat-story-stickers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-story-stickers-web
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and verify Web integration
        run: node scripts/activateChatStoryStickerStage4.mjs
      - name: Commit Web replacement
        run: |
          git add src/pages/Author/ChatStoryEditorPage.jsx
          if git diff --cached --quiet; then
            echo "Web Sticker integration already active"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Activate Chat Story Sticker editor integration"
            git push origin HEAD:main
          fi

name: Web Router Security Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare targeted router update
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/package.before.json"
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          node --input-type=module <<'NODE'
          import { isDeepStrictEqual } from 'node:util'
          const equal = (actual, expected, label) => {
            if (isDeepStrictEqual(actual, expected)) return
            console.error(label, '\nExpected:', JSON.stringify(expected), '\nActual:', JSON.stringify(actual))
            throw new Error(label)
          }
          import fs from 'node:fs'
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          equal(lock.packages['node_modules/react-router-dom'].version, '6.30.3', 'Unexpected starting router version')
          equal(manifest.dependencies['react-router-dom'], lock.packages[''].dependencies['react-router-dom'], 'Manifest and lockfile router ranges differ')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact react-router-dom@6.30.6
      - name: Reject unrelated dependency changes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { isDeepStrictEqual } from 'node:util'
          const equal = (actual, expected, label) => {
            if (isDeepStrictEqual(actual, expected)) return
            console.error(label, '\nExpected:', JSON.stringify(expected), '\nActual:', JSON.stringify(actual))
            throw new Error(label)
          }
          import fs from 'node:fs'
          import path from 'node:path'
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'))
          const before = read(path.join(process.env.RUNNER_TEMP, 'package.before.json'))
          const after = read('package.json')
          before.dependencies['react-router-dom'] = '6.30.6'
          equal(after, before, 'Unexpected package.json change')
          const old = read(path.join(process.env.RUNNER_TEMP, 'package-lock.before.json'))
          const next = read('package-lock.json')
          const allowed = new Set(['node_modules/react-router-dom', 'node_modules/react-router', 'node_modules/@remix-run/router'])
          equal(next.packages['node_modules/react-router-dom'].version, '6.30.6', 'Unexpected react-router-dom target version')
          equal(next.packages['node_modules/react-router'].version, '6.30.6', 'Unexpected react-router target version')
          old.packages[''].dependencies['react-router-dom'] = '6.30.6'
          const rollup = old.packages['node_modules/rollup']
          const platformPackages = rollup?.optionalDependencies || {}
          const normalized = []
          const unexpected = []
          for (const key of new Set([...Object.keys(old.packages), ...Object.keys(next.packages)])) {
            const previous = old.packages[key]
            const current = next.packages[key]
            if (allowed.has(key)) {
              console.log(key, previous?.version, '->', current?.version)
              continue
            }
            if (isDeepStrictEqual(previous, current)) continue
            const name = key.slice('node_modules/'.length)
            if (key.startsWith('node_modules/@rollup/rollup-') && Object.hasOwn(platformPackages, name) && previous?.dev === true && previous.optional === true && current?.optional === true) {
              const restored = { ...current }
              if (current.dev === undefined || current.dev === false) restored.dev = true
              if (Object.hasOwn(previous, 'libc') && !Object.hasOwn(current, 'libc')) restored.libc = previous.libc
              if (isDeepStrictEqual(previous, restored)) {
                next.packages[key] = previous
                normalized.push(key)
                continue
              }
            }
            unexpected.push(key || 'root')
            console.error('Unexpected dependency change:', key || 'root', '\nBefore:', JSON.stringify(previous), '\nAfter:', JSON.stringify(current))
          }
          if (unexpected.length) throw new Error(`Unexpected dependency changes: ${unexpected.join(', ')}`)
          equal(next.packages['node_modules/react-router-dom'].dependencies, { '@remix-run/router': next.packages['node_modules/@remix-run/router'].version, 'react-router': '6.30.6' }, 'Unexpected router-dom dependencies')
          equal(next.packages['node_modules/react-router'].dependencies, { '@remix-run/router': next.packages['node_modules/@remix-run/router'].version }, 'Unexpected router dependencies')
          for (const key of allowed) {
            const entry = next.packages[key]
            if (!entry?.integrity || !entry.resolved?.startsWith('https://registry.npmjs.org/')) throw new Error(`Missing registry integrity or source: ${key}`)
          }
          console.log('Restored original optional Rollup metadata (dev/libc):', normalized)
          fs.writeFileSync('package-lock.json', JSON.stringify(next, null, 2) + '\n')
          for (const key of new Set([...Object.keys(old.packages), ...Object.keys(next.packages)])) {
            if (!allowed.has(key)) equal(next.packages[key], old.packages[key], `Unexpected final change: ${key || 'root'}`)
          }
          equal({ ...next, packages: undefined }, { ...old, packages: undefined }, 'Unexpected lockfile top-level changes')
          NODE
          git diff --stat
      - name: Install and build
        run: |
          cp package.json "$RUNNER_TEMP/package.candidate.json"
          cp package-lock.json "$RUNNER_TEMP/package-lock.candidate.json"
          npm ci --no-audit --no-fund
          npm run build
          cmp package.json "$RUNNER_TEMP/package.candidate.json"
          cmp package-lock.json "$RUNNER_TEMP/package-lock.candidate.json"
      - name: Collect advisory report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/router-patch"
          cp package.json package-lock.json "$RUNNER_TEMP/router-patch/"
          npm audit --json > "$RUNNER_TEMP/router-patch/npm-audit.json" || true
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/router-patch/changes.patch"
      - name: Upload reviewed candidate
        uses: actions/upload-artifact@v4
        with:
          name: web-router-security-patch
          path: ${{ runner.temp }}/router-patch/
          if-no-files-found: error
          retention-days: 7
      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/router-diagnostics"
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/router-diagnostics/changes.patch"
          cp package.json package-lock.json "$RUNNER_TEMP/router-diagnostics/"
          node --version > "$RUNNER_TEMP/router-diagnostics/versions.txt"
          npm --version >> "$RUNNER_TEMP/router-diagnostics/versions.txt"
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-router-security-diagnostics
          path: ${{ runner.temp }}/router-diagnostics/
          if-no-files-found: warn
          retention-days: 7

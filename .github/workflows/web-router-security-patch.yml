name: Web Router Security Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated Swiper lock entry
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/swiper-isolated" "$RUNNER_TEMP/swiper-diagnostics"
          cp package.json "$RUNNER_TEMP/swiper-diagnostics/package.before.json"
          cp package-lock.json "$RUNNER_TEMP/swiper-diagnostics/package-lock.before.json"
          cd "$RUNNER_TEMP/swiper-isolated"
          npm init -y
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact swiper@12.1.2
      - name: Apply only Swiper update
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import assert from 'node:assert/strict'
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'))
          const write = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n')
          const target = '12.1.2'
          const key = 'node_modules/swiper'
          const manifest = read('package.json')
          const lock = read('package-lock.json')
          const generated = read(path.join(process.env.RUNNER_TEMP, 'swiper-isolated', 'package-lock.json'))
          const entry = generated.packages[key]
          assert.equal(lock.lockfileVersion, 3)
          assert.equal(lock.packages[key].version, '11.2.10')
          assert.equal(manifest.dependencies.swiper, lock.packages[''].dependencies.swiper)
          assert.equal(manifest.dependencies['react-router-dom'], '6.30.6')
          assert.equal(lock.packages['node_modules/react-router-dom'].version, '6.30.6')
          assert.equal(generated.packages[''].dependencies.swiper, target)
          assert.deepEqual(Object.keys(generated.packages).sort(), ['', key].sort())
          assert.equal(entry.version, target)
          assert.equal(entry.resolved, `https://registry.npmjs.org/swiper/-/swiper-${target}.tgz`)
          assert.match(entry.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/)
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            assert.equal(Object.keys(entry[field] || {}).length, 0, `Unexpected Swiper ${field}`)
          }
          assert.ok(!entry.dev && !entry.optional && !entry.link)
          const html = fs.readFileSync('index.html', 'utf8')
          for (const ext of ['css', 'js']) {
            assert.ok(html.includes(`https://unpkg.com/swiper@${target}/swiper-bundle.min.${ext}`), `Expected pinned CDN ${ext} URL is missing`)
          }
          manifest.dependencies.swiper = target
          lock.packages[''].dependencies.swiper = target
          lock.packages[key] = entry
          write('package.json', manifest)
          write('package-lock.json', lock)
          const beforeManifest = read(path.join(process.env.RUNNER_TEMP, 'swiper-diagnostics', 'package.before.json'))
          const beforeLock = read(path.join(process.env.RUNNER_TEMP, 'swiper-diagnostics', 'package-lock.before.json'))
          beforeManifest.dependencies.swiper = target
          beforeLock.packages[''].dependencies.swiper = target
          beforeLock.packages[key] = entry
          assert.deepEqual(read('package.json'), beforeManifest)
          assert.deepEqual(read('package-lock.json'), beforeLock)
          console.log('Only Swiper manifest and lock entries changed. All other lock entries preserved.')
          NODE
          git diff --stat
      - name: Install and build candidate
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/swiper-manifest.candidate.json"
          cp package-lock.json "$RUNNER_TEMP/swiper-lock.candidate.json"
          npm ci --no-audit --no-fund
          npm run build
          cmp package.json "$RUNNER_TEMP/swiper-manifest.candidate.json"
          cmp package-lock.json "$RUNNER_TEMP/swiper-lock.candidate.json"
      - name: Audit candidate and prepare artifact
        shell: bash
        run: |
          out="$RUNNER_TEMP/swiper-diagnostics"
          npm audit --json > "$out/npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import assert from 'node:assert/strict'
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'swiper-diagnostics', 'npm-audit.json'), 'utf8'))
          assert.ok(!report.error && report.metadata?.vulnerabilities && report.vulnerabilities, 'Invalid npm audit report')
          assert.ok(!Object.hasOwn(report.vulnerabilities, 'swiper'), 'Swiper still appears in npm audit; review the new advisory')
          console.log(JSON.stringify(report.metadata.vulnerabilities, null, 2))
          NODE
          mkdir -p "$RUNNER_TEMP/web-swiper-security-patch"
          cp package.json package-lock.json "$out/npm-audit.json" "$RUNNER_TEMP/web-swiper-security-patch/"
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/web-swiper-security-patch/changes.patch"
      - name: Upload reviewed Swiper candidate
        uses: actions/upload-artifact@v4
        with:
          name: web-swiper-security-patch
          path: ${{ runner.temp }}/web-swiper-security-patch/
          if-no-files-found: error
          retention-days: 7
      - name: Save failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/swiper-diagnostics"
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/swiper-diagnostics/changes.patch"
          cp package.json package-lock.json "$RUNNER_TEMP/swiper-diagnostics/"
          if [ -f "$RUNNER_TEMP/swiper-isolated/package-lock.json" ]; then cp "$RUNNER_TEMP/swiper-isolated/package-lock.json" "$RUNNER_TEMP/swiper-diagnostics/swiper-isolated-lock.json"; fi
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-swiper-security-diagnostics
          path: ${{ runner.temp }}/swiper-diagnostics/
          if-no-files-found: warn
          retention-days: 7

name: Web Final Security Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save baseline and generate candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/web-final-security-candidate"
          mkdir -p "$out"
          cp package.json "$out/package.before.json"
          cp package-lock.json "$out/package-lock.before.json"
          git rev-parse HEAD > "$out/base-commit.txt"
          node --version > "$out/node-version.txt"
          npm --version > "$out/npm-version.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const version = name => l.packages[`node_modules/${name}`]?.version
          if (version('swiper') !== '12.1.2' || version('react-router-dom') !== '6.30.6' || version('vite') !== '5.4.21') {
            throw new Error('Baseline differs from the reviewed Swiper patch. Inspect the current main branch before upgrading.')
          }
          p.dependencies['react-router-dom'] = '7.18.7'
          p.devDependencies.vite = '6.4.6'
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Review dependency changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { isDeepStrictEqual } from 'node:util'
          const out = path.join(process.env.RUNNER_TEMP, 'web-final-security-candidate')
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'))
          const old = read(path.join(out, 'package-lock.before.json'))
          const next = read('package-lock.json')
          const manifest = read('package.json')
          const expected = read(path.join(out, 'package.before.json'))
          expected.dependencies['react-router-dom'] = '7.18.7'
          expected.devDependencies.vite = '6.4.6'
          if (!isDeepStrictEqual(manifest, expected)) throw new Error('Unexpected manifest change')
          for (const section of ['dependencies', 'devDependencies']) {
            if (!isDeepStrictEqual(manifest[section], next.packages[''][section])) throw new Error(`Manifest/lock mismatch: ${section}`)
          }
          const changes = []
          for (const key of new Set([...Object.keys(old.packages), ...Object.keys(next.packages)])) {
            const a = old.packages[key], b = next.packages[key]
            if (!isDeepStrictEqual(a, b)) changes.push({ path: key, before: a?.version ?? null, after: b?.version ?? null, metadataOnly: !!a && !!b && a.version === b.version && a.integrity === b.integrity && a.resolved === b.resolved })
          }
          fs.writeFileSync(path.join(out, 'dependency-changes.json'), JSON.stringify(changes, null, 2) + '\n')
          const unexpected = []
          for (const name of Object.keys({...manifest.dependencies, ...manifest.devDependencies})) {
            if (['vite', 'react-router-dom'].includes(name)) continue
            const key = `node_modules/${name}`
            const a = old.packages[key], b = next.packages[key]
            if (!a || !b || a.version !== b.version || a.integrity !== b.integrity || a.resolved !== b.resolved) unexpected.push(name)
          }
          if (unexpected.length) throw new Error(`Unrelated direct dependency changes: ${unexpected.join(', ')}`)
          for (const [name, version] of Object.entries({'vite': '6.4.6', 'react-router-dom': '7.18.7', 'react-router': '7.18.7', 'swiper': '12.1.2'})) {
            if (next.packages[`node_modules/${name}`]?.version !== version) throw new Error(`Unexpected ${name} version`)
          }
          NODE
          git diff --stat
      - name: Install and build candidate
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/candidate-manifest.json"
          cp package-lock.json "$RUNNER_TEMP/candidate-lock.json"
          npm ci --no-audit --no-fund
          npm run build
          cmp package.json "$RUNNER_TEMP/candidate-manifest.json"
          cmp package-lock.json "$RUNNER_TEMP/candidate-lock.json"
          printf 'PASS\n' > "$RUNNER_TEMP/web-final-security-candidate/build-status.txt"
      - name: Security audit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/web-final-security-candidate"
          status=0
          npm audit --json > "$out/npm-audit.json" || status=$?
          printf '%s\n' "$status" > "$out/audit-exit-code.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const out = path.join(process.env.RUNNER_TEMP, 'web-final-security-candidate')
          const a = JSON.parse(fs.readFileSync(path.join(out, 'npm-audit.json'), 'utf8'))
          if (a.error || !a.metadata?.vulnerabilities || !a.vulnerabilities) throw new Error('npm audit did not return a valid report')
          console.log(JSON.stringify(a.metadata.vulnerabilities, null, 2))
          if (Object.keys(a.vulnerabilities).length) throw new Error('Remaining security findings require review; do not deploy automatically')
          NODE
      - name: Collect candidate and diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/web-final-security-candidate"
          mkdir -p "$out"
          if [ -f package.json ] && [ -f package-lock.json ]; then
            cp package.json package-lock.json "$out/"
            git diff -- package.json package-lock.json > "$out/changes.patch"
          fi
          if [ ! -f "$out/build-status.txt" ]; then printf 'NOT PASSED\n' > "$out/build-status.txt"; fi
      - name: Upload candidate for review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-final-security-candidate
          path: ${{ runner.temp }}/web-final-security-candidate/
          if-no-files-found: error
          retention-days: 7

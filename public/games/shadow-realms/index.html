<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17251a">
  <meta name="color-scheme" content="dark">
  <title>Shadow Realms — Living Rice Farm</title>
  <style>
    :root { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark }
    * { box-sizing:border-box }
    html,body { height:100%;margin:0;overflow:hidden;background:#101e14 }
    button,a { font:inherit }
    button { cursor:pointer }
    button:focus-visible,a:focus-visible { outline:2px solid #ffcd57;outline-offset:2px }
    .app { height:100vh;height:100dvh;display:flex;flex-direction:column }
    .top { height:51px;flex:none;position:relative;z-index:3;display:flex;align-items:center;
      justify-content:space-between;gap:12px;padding:7px 14px;color:#fceecb;
      background:linear-gradient(#293b2b,#192a1c);border-bottom:2px solid #72845d }
    .brand { display:flex;gap:9px;align-items:center;min-width:0 }
    .brand strong { font-size:clamp(15px,2vw,20px);white-space:nowrap }
    .stage { font-size:10px;font-weight:800;white-space:nowrap;color:#e4d5aa;
      border:1px solid #83906b;border-radius:99px;padding:4px 9px }
    .back { color:#f8eac9;text-decoration:none;border:1px solid #8c9878;padding:7px 12px;
      border-radius:9px;white-space:nowrap;font-size:12px }
    .map-area { position:relative;flex:1;min-height:0;overflow:hidden;background:#91b46b }
    #game { display:block;width:100%;height:100%;outline:0;touch-action:none }
    .status { position:absolute;top:10px;left:12px;z-index:2;pointer-events:none;
      max-width:min(560px,calc(100% - 136px));display:flex;flex-direction:column;gap:5px }
    .status-line { padding:7px 10px;border-radius:10px;background:rgba(18,32,24,.87);
      border:1px solid rgba(255,255,255,.12);color:#fff0c6;font-size:11px;
      line-height:1.4;box-shadow:0 4px 12px #0002 }
    .farm-stats { color:#daedbf }
    .zoom-panel { position:absolute;right:12px;top:10px;z-index:3;display:flex;flex-direction:column;gap:7px }
    .control { width:41px;height:41px;border:1px solid #b3ac81;border-radius:11px;
      background:rgba(28,43,30,.92);color:#fff4cf;font-weight:800;font-size:21px;
      box-shadow:0 2px 9px #0005;touch-action:manipulation }
    .control:active { background:#526942 }
    .control.home { font-size:17px }
    .error { position:absolute;inset:0;z-index:60;display:none;align-items:center;
      justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;
      background:rgba(10,23,16,.96);color:#fff4d6 }
    .error.show { display:flex }
    .error strong { font-size:18px }
    .error p { line-height:1.6;max-width:510px;font-size:13px }
    .error pre { max-width:95vw;overflow-wrap:anywhere;white-space:pre-wrap;font-size:11px }

    /* Integrate existing CommandFooter without a duplicate heading. */
    .sr-ui-shell .sr-ui-topbar,.sr-ui-shell .sr-ui-hint { display:none }
    .sr-ui-shell .sr-ui-footer { z-index:2 }
    .sr-ui-shell .sr-ui-square-btn:disabled,
    .sr-ui-shell .sr-ui-mode-chip:disabled,
    .sr-ui-shell .sr-ui-mobile-btn:disabled { opacity:.37;cursor:not-allowed;filter:none }
    .sr-ui-shell .sr-ui-resource-card { padding:7px 10px }
    .sr-ui-shell .sr-ui-resource-grid { gap:5px }
    .sr-ui-shell .sr-ui-action-list { grid-template-columns:repeat(3,minmax(0,1fr)) }
    .sr-ui-shell .sr-ui-square-btn { padding:10px 5px }
    .sr-ui-shell .sr-ui-mobile-pad .sr-farm-mobile-actions { display:grid;gap:6px;margin-top:9px;
      padding-top:8px;border-top:1px solid #fff2 }
    .sr-ui-shell .sr-ui-mobile-pad .sr-farm-mobile-actions button { background:#36543e;
      color:#fff3d2;border:1px solid #648669;border-radius:10px;padding:9px 5px;
      font-size:11px;font-weight:750 }
    @media (max-width:980px) {
      .sr-ui-shell .sr-ui-footer { grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:6px;gap:6px }
      .sr-ui-shell .sr-ui-panel--center { display:none }
      .sr-ui-shell .sr-ui-panel--left { order:1 }
      .sr-ui-shell .sr-ui-panel--right { order:2 }
      .sr-ui-shell .sr-ui-panel { min-height:0;min-width:0;padding:7px }
      .sr-ui-shell .sr-ui-title { font-size:10px;margin-bottom:4px }
      .sr-ui-shell .sr-ui-resource-card { padding:4px 6px;gap:5px }
      .sr-ui-shell .sr-ui-resource-grid { gap:3px }
      .sr-ui-shell .sr-ui-resource-icon { font-size:15px }
      .sr-ui-shell .sr-ui-resource-label { font-size:10px }
      .sr-ui-shell .sr-ui-resource-value { font-size:13px }
      .sr-ui-shell .sr-ui-selected-card { padding:6px }
      .sr-ui-shell .sr-ui-selected-name { font-size:12px }
      .sr-ui-shell .sr-ui-selected-sub { display:none }
      .sr-ui-shell .sr-ui-minimap { height:34px;margin-top:5px }
      .sr-ui-shell .sr-ui-zoom-row { margin-top:4px }
      .sr-ui-shell .sr-ui-zoom-btn { width:27px;height:27px }
    }
    @media (max-width:760px) {
      .stage { display:none }
      .status { max-width:calc(100% - 140px);left:8px;top:9px }
      .status-line { padding:6px 8px;font-size:10px }
      .zoom-panel { left:8px;right:auto;top:95px }
      .sr-ui-shell .sr-ui-footer { padding-right:6px }
      .sr-ui-shell .sr-ui-mobile-pad { right:8px;top:64px;width:122px;padding:8px }
      .sr-ui-shell .sr-ui-mobile-btn { padding:7px 3px }
    }
    @media (max-height:650px) {
      .sr-ui-shell .sr-ui-minimap { display:none }
      .sr-ui-shell .sr-ui-panel { padding:5px }
      .sr-ui-shell .sr-ui-resource-card { padding:3px 5px }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Shadow Realms local strategy game">
    <header class="top">
      <div class="brand">
        <strong>Shadow Realms</strong>
        <span class="stage" id="stage-label">LIVING RICE • FARM TEST</span>
      </div>
      <a href="/game" class="back" id="back-link">‹ Games</a>
    </header>
    <section class="map-area" aria-label="Battlefield">
      <canvas id="game" aria-label="Three-quarter-view rice farming world"></canvas>
      <div class="status" aria-live="polite">
        <div class="status-line" id="map-status">Choose a farmer and harvest a field.</div>
        <div class="status-line farm-stats" id="farm-stats">Fields: 6 • Ripe crops: ...</div>
      </div>
      <nav class="zoom-panel" aria-label="Camera controls">
        <button class="control" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="control" id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="control home" id="reset-camera" type="button" aria-label="Reset camera">⌂</button>
      </nav>
      <div class="error" id="game-error" role="alert">
        <strong id="error-title">Unable to start Shadow Realms</strong>
        <p id="error-message"></p>
        <pre id="error-details"></pre>
      </div>
    </section>
  </main>

        auto:'자동 수확',home:'기지 복귀',harvest:'수확',select:'선택',move:'이동',

  <script type="module">
    try {
      const [engineLib, farmerLib, routeLib, selectionLib, footerLib, riceLib] = await Promise.all([
        import('./core/GameEngine.js'),
        import('./characters/Farmer.js'),
        import('./core/Pathfinding.js'),
        import('./ui/SelectionController.js'),
        import('./ui/CommandFooter.js'),
        import('./world/RiceSystem.js'),
      ]);
      const { GameEngine } = engineLib;
      const { Farmer } = farmerLib;
      const { Pathfinding } = routeLib;
      const { SelectionController } = selectionLib;
      const { CommandFooter } = footerLib;
      const { RiceSystem } = riceLib;

      const canvas = document.getElementById('game');
      const game = new GameEngine({ canvas });
      const { map, camera } = game;
      const rice = new RiceSystem(map);
      const route = new Pathfinding(map);
      const home = map.getSpawnPoint('blue');
      const farmers = [];
      const jobs = new Map();
      const MAX_FARMERS = 12;
      const statusNode = document.getElementById('map-status');
      const farmStats = document.getElementById('farm-stats');
      const footer = new CommandFooter({ root:document.body }).mount();
      let farmerNumber = 0;
      let selection;
      let hudElapsed = 0;
      let lastSummary = '';
      let currentMessage = '';

      const dist = (a,b) => Math.hypot(a.x - b.x, a.y - b.y);
      const reserveOf = id => [...jobs.values()].some(job => job.plantId === id && job.phase !== 'seek');
      const selectedFarmers = () => selection ? selection.selectedUnits() : [];
      const message = text => {
        if (text === currentMessage) return;
        currentMessage = text;
        statusNode.textContent = text;
        footer.setResources({ hint:text });
      };

      // Construction remains inactive until there is a real BuildingSystem.
      for (const selector of [
        '[data-mode="build"]','[data-touch="build"]',
        '[data-action="ghostHouse"]','[data-action="ghostBarn"]','[data-action="cancelBuild"]',
      ]) {
        for (const button of footer.nodes.shell.querySelectorAll(selector)) {
          button.disabled = true;
          button.title = tr.disabled;
        }
      }
      // Use existing, functional command buttons rather than inventing a parallel UI.
      for (const button of footer.nodes.shell.querySelectorAll('[data-action="sendToField"]')) button.textContent = tr.auto;
      for (const button of footer.nodes.shell.querySelectorAll('[data-action="returnHome"]')) button.textContent = tr.home;
      for (const button of footer.nodes.shell.querySelectorAll('[data-mode="harvest"],[data-touch="harvest"]')) button.textContent = tr.harvest;
      for (const button of footer.nodes.shell.querySelectorAll('[data-mode="select"],[data-touch="select"]')) button.textContent = tr.select;
      for (const button of footer.nodes.shell.querySelectorAll('[data-mode="move"],[data-touch="move"]')) button.textContent = tr.move;

      // Mobile has no center command panel; expose genuine actions on the right.
      const mobilePad = footer.nodes.shell.querySelector('.sr-ui-mobile-pad');
      if (mobilePad) {
        const actions = document.createElement('div');
        actions.className = 'sr-farm-mobile-actions';
        for (const [action, title] of [['sendToField',tr.auto],['returnHome',tr.home],['spawnFarmer','+ Farmer']]) {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.action = action;
          button.textContent = title;
          actions.appendChild(button);
        }
        mobilePad.appendChild(actions);
      }

      function syncHud() {
        const stats = rice.getSummary();
        const carry = farmers.reduce((total,farmer)=> total + (farmer.carry || 0),0);
        footer.setResources({rice:stats.rice,wood:0,villagers:farmers.length,zoom:camera.zoom});
        const line = `${tr.fields}: ${stats.fields} · ${tr.ripe}: ${stats.plants.ripe}/${stats.plants.total} · ${tr.carrying}: ${carry}`;
        if (line !== lastSummary) {
          farmStats.textContent = line;
          lastSummary = line;
        }
      }

      function freePosition(origin, spacing=39) {
        for (let ring=0; ring<8; ring++) {
          const count = ring ? Math.max(12,ring*12) : 1;
          for (let i=0;i<count;i++) {
            const angle = 2*Math.PI*i/count;
            const x = origin.x + Math.cos(angle)*spacing*ring;
            const y = origin.y + Math.sin(angle)*spacing*ring;
            if (!map.isWalkable(x,y,14)) continue;
            if (farmers.some(f=>dist(f,{x,y})<37)) continue;
            return {x,y};
          }
        }
        return null;
      }

      function spawnFarmer() {
        if (farmers.length >= MAX_FARMERS) { message(tr.maximum);return null; }
        const pos = freePosition(home);
        if (!pos) {message(tr.noRoute);return null;}
        const farmer = new Farmer({id:`farmer-${++farmerNumber}`,name:`Farmer ${farmerNumber}`,team:'blue',...pos});
        farmer.onBlocked = () => {
          const job = jobs.get(farmer.id);
          if (job) { job.phase='seek';job.plantId=null;job.timer=1.5; }
          message(tr.noRoute);
        };
        farmers.push(farmer);
        syncHud();
        return farmer;
      }

      function manualMove(units,point) {
        if (!units.length) {message(tr.noSelected);return;}
        let success=0;
        const cols=Math.ceil(Math.sqrt(units.length));
        const rows=Math.ceil(units.length/cols);
        units.forEach((farmer,i)=>{
          jobs.delete(farmer.id);
          farmer.setHarvestAnimation(false);
          const desired=units.length===1 ? point : {
            x:point.x+(i%cols-(cols-1)/2)*39,
            y:point.y+(Math.floor(i/cols)-(rows-1)/2)*39,
          };
          const target=map.isWalkable(desired.x,desired.y,farmer.radius)?desired:point;
          if (route.moveUnit(farmer,target)) success++;
        });
        message(success?`${tr.move}: ${success}/${units.length}`:tr.noRoute);
      }

      function chooseField(point,nearest=false) {
        const direct=rice.getFieldAt(point,nearest?180:25);
        if (direct) return direct;
        if (!nearest) return null;
        let result=null, best=Infinity;
        for (const field of rice.getFields()) {
          const length=dist(field,point);
          if (length<best) {best=length;result=field;}
        }
        return result;
      }

      function pickPlant(farmer,fieldId) {
        const candidates=rice.plants.filter(p=>p.fieldId===fieldId && rice.isRipe(p) && !reserveOf(p.id));
        candidates.sort((a,b)=>dist(a,farmer)-dist(b,farmer));
        return candidates;
      }

      function safeStand(plant,farmer) {
        if (map.isWalkable(plant.x,plant.y,farmer.radius)) return {x:plant.x,y:plant.y};
        for (let radius=12;radius<=44;radius+=8) {
          for (let i=0;i<16;i++) {
            const angle=i*Math.PI/8;
            const point={x:plant.x+Math.cos(angle)*radius,y:plant.y+Math.sin(angle)*radius};
            if (map.isWalkable(point.x,point.y,farmer.radius)) return point;
          }
        }
        return null;
      }

      function beginReturn(farmer, resume=false) {
        farmer.setHarvestAnimation(false);
        const existing=jobs.get(farmer.id);
        const job=existing || {type:'return',fieldId:null,timer:0};
        job.phase='return';job.plantId=null;job.resume=Boolean(resume && job.fieldId);
        jobs.set(farmer.id,job);
        if (dist(farmer,home)<=rice.config.depositRange) {
          completeReturn(farmer,job);
          return;
        }
        if (!route.moveUnit(farmer,home)) {
          job.phase='returnRetry';job.timer=1.5;
          message(tr.noRoute);
        } else message(tr.returning);
      }

      function completeReturn(farmer,job) {
        const result=rice.deposit(farmer,home);
        if (result.ok) message(`${tr.deposited}: +${result.amount}`);
        else if (!job.resume) message(tr.home);
        farmer.setHarvestAnimation(false);
        if (job.resume && job.fieldId) {
          job.phase='seek';job.timer=0;job.plantId=null;
        } else jobs.delete(farmer.id);
      }

      function seekHarvest(farmer,job) {
        if (farmer.carry + rice.config.yieldPerPlant > rice.config.carryingCapacity) {
          beginReturn(farmer,true);
          return;
        }
        let planned=false;
        for (const plant of pickPlant(farmer,job.fieldId)) {
          const target=safeStand(plant,farmer);
          if (!target) continue;
          if (dist(farmer,plant)<=rice.config.harvestRange-5) {
            farmer.setHarvestAnimation(true);
            job.phase='swing';job.plantId=plant.id;job.timer=.62;
            planned=true;
            break;
          }
          if (route.moveUnit(farmer,target)) {
            job.phase='travel';job.plantId=plant.id;
            planned=true;
            break;
          }
        }
        if (!planned) {
          job.plantId=null;
          if (farmer.carry>0) beginReturn(farmer,true);
          else {farmer.setHarvestAnimation(false);job.phase='waiting';job.timer=1.8;}
        }
      }

      function startHarvest(farmersToSend,point) {
        if (!farmersToSend.length) {message(tr.noSelected);return;}
        const field=chooseField(point,false);
        if (!field) {message(tr.noField);return;}
        let started=0;
        for (const farmer of farmersToSend) {
          farmer.stop();
          farmer.setHarvestAnimation(false);
          jobs.set(farmer.id,{type:'harvest',fieldId:field.id,phase:'seek',timer:0,plantId:null,resume:true});
          seekHarvest(farmer,jobs.get(farmer.id));
          started++;
        }
        message(`${tr.harvesting}: ${started}`);
      }

      function autoHarvest(units) {
        if (!units.length) {message(tr.noSelected);return;}
        const viable=rice.getFields().filter(field=>
          field.x<map.width*.5 && field.plants.some(p=>rice.isRipe(p)));
        const pool=viable.length?viable:rice.getFields().filter(field=>field.x<map.width*.5);
        if (!pool.length) {message(tr.noField);return;}
        for (const farmer of units) {
          const target=[...pool].sort((a,b)=>dist(a,farmer)-dist(b,farmer))[0];
          farmer.stop();farmer.setHarvestAnimation(false);
          jobs.set(farmer.id,{type:'harvest',fieldId:target.id,phase:'seek',timer:0,plantId:null,resume:true});
          seekHarvest(farmer,jobs.get(farmer.id));
        }
        message(`${tr.harvesting}: ${units.length}`);
      }

      function runJob(farmer,dt) {
        const job=jobs.get(farmer.id);
        if (!job) {
          if (farmer.carry>0 && dist(farmer,home)<=rice.config.depositRange) {
            const result=rice.deposit(farmer,home);
            if (result.ok) message(`${tr.deposited}: +${result.amount}`);
          }
          return;
        }
        if (job.phase==='swing') {
          job.timer-=dt;
          if (job.timer>0) return;
          const result=rice.harvestPlant(job.plantId,farmer);
          farmer.setHarvestAnimation(false);
          job.plantId=null;
          job.phase='seek';job.timer=0.12;
          if (!result.ok && result.reason==='full') beginReturn(farmer,true);
          return;
        }
        if (job.phase==='travel' && farmer.state!=='walking') {
          const plant=rice.byId.get(job.plantId);
          if (plant && rice.isRipe(plant) && dist(farmer,plant)<=rice.config.harvestRange) {
            farmer.setHarvestAnimation(true);
            job.phase='swing';job.timer=.62;
          } else {job.plantId=null;job.phase='seek';job.timer=.3;}
          return;
        }
        if (job.phase==='return' && (dist(farmer,home)<=rice.config.depositRange || farmer.state!=='walking')) {
          if (dist(farmer,home)<=rice.config.depositRange) completeReturn(farmer,job);
          else {job.phase='returnRetry';job.timer=1.5;}
          return;
        }
        if (job.phase==='seek'||job.phase==='waiting'||job.phase==='returnRetry') {
          job.timer-=dt;
          if (job.timer>0) return;
          if (job.phase==='returnRetry') beginReturn(farmer,job.resume);
          else seekHarvest(farmer,job);
        }
      }

      function actionHandler(action) {
        if (action==='zoomIn') {zoomBy(1.18);return;}
        if (action==='zoomOut') {zoomBy(1/1.18);return;}
        if (action==='spawnFarmer') {
          const f=spawnFarmer();
          if (f) {selection.setSelectedIds([f.id]);message(`${tr.spawned}: ${farmers.length}`);}
          return;
        }
        if (action==='sendToField') {autoHarvest(selectedFarmers());return;}
        if (action==='returnHome') {
          const chosen=selectedFarmers();
          if (!chosen.length) {message(tr.noSelected);return;}
          for (const farmer of chosen) {jobs.delete(farmer.id);beginReturn(farmer,false);}
          return;
        }
        if (action==='ghostHouse'||action==='ghostBarn'||action==='cancelBuild') message(tr.disabled);
      }

      function zoomBy(factor) {camera.zoomAt(camera.zoom*factor);canvas.focus({preventScroll:true});}

      game.onUpdate=(dt)=>{
        rice.update(dt);
        for (const farmer of farmers) {
          farmer.update(dt,map);
          runJob(farmer,dt);
        }
        hudElapsed+=dt;
        if (hudElapsed>=.25) {hudElapsed=0;syncHud();}
      };
      game.onRender=(ctx,currentCamera)=>{
        rice.drawGround(ctx,currentCamera);
        rice.drawCrops(ctx,currentCamera);
        for (const farmer of [...farmers].sort((a,b)=>a.y-b.y)) farmer.draw(ctx,currentCamera);
      };

      selection=new SelectionController({
        engine:game,footer,getUnits:()=>farmers,playerTeam:'blue',
        onCommand:({type,units,point})=>{
          if (type==='move') manualMove(units,point);
          else if (type==='harvest') startHarvest(units,point);
          else message(tr.disabled);
        },
        onAction:actionHandler,
      }).attach();

      for (let i=0;i<3;i++) spawnFarmer();
      if (farmers.length) selection.setSelectedIds([farmers[0].id]);
      syncHud();
      footer.setResources({hint:tr.help});

      document.getElementById('zoom-in').addEventListener('click',()=>zoomBy(1.18));
      document.getElementById('zoom-out').addEventListener('click',()=>zoomBy(1/1.18));
      document.getElementById('reset-camera').addEventListener('click',()=>{
        camera.zoomAt(1);camera.centerOn(home.x,home.y);
      });
      const visibility=()=>{
        if (document.hidden) game.stop();
        else if (!game.destroyed) game.start();
      };
      document.addEventListener('visibilitychange',visibility);
      window.addEventListener('pagehide',()=>{
        document.removeEventListener('visibilitychange',visibility);
        selection.destroy();footer.destroy();game.destroy();
      },{once:true});
      window.shadowRealmsGame=game;
      window.shadowRealmsRice=rice;
      game.start();
    } catch(error) {
      window.showGameError(error);
      console.error('Shadow Realms rice game:',error);
    }
  </script>
</body>
</html>

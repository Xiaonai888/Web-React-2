<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#162319" />
  <title>Shadow Realms — Stage 1</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0e1d14; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #f3d68b; outline-offset: 2px; }
    .app { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .top {
      position: relative; z-index: 2; min-height: 54px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
      background: linear-gradient(180deg,#27392b,#192b21); border-bottom: 2px solid #526944;
      color: #fff4cf;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand strong { font-size: clamp(14px,2.8vw,19px); white-space: nowrap; }
    .tag { font-size: 10px; font-weight: 700; white-space: nowrap; color: #d0ddb7; border: 1px solid #77906c; padding: 3px 7px; border-radius: 999px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .back { color: #f3e7be; text-decoration: none; font-size: 12px; border: 1px solid #6a7958; border-radius: 8px; padding: 7px 9px; }
    .map-area { position: relative; flex: 1; min-height: 0; background: #91b46b; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .zoom-panel { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 7px; z-index: 1; }
    .control {
      min-width: 42px; min-height: 42px; border: 1px solid #b3ac81; border-radius: 11px;
      color: #fff6da; background: rgba(31,48,32,.89); box-shadow: 0 3px 12px #0004;
      display: grid; place-items: center; font-weight: 800; font-size: 22px;
      touch-action: manipulation;
    }
    .control:active { background: #536744; transform: scale(.96); }
    .control.home { font-size: 17px; }
    .bottom {
      min-height: 65px; display: flex; align-items: center; gap: 10px; justify-content: space-between;
      padding: 9px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
      color: #eee1b5; border-top: 3px solid #98794b;
      background: linear-gradient(180deg,#3b3326,#211f1a);
    }
    .status { min-width: 0; }
    .status strong { font-size: 13px; }
    .status small { display: block; margin-top: 3px; font-size: 11px; color: #cabd9d; line-height: 1.4; }
    .coords { flex-shrink: 0; color: #d7c997; font-variant-numeric: tabular-nums; font-size: 12px; }
    .error { position: absolute; inset: 0; z-index: 4; padding: 24px; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #15241ce8; color: #fff0d9; gap: 10px; }
    .error.show { display: flex; }
    .error p { max-width: 460px; line-height: 1.65; font-size: 13px; }
    .error pre { max-width: 90vw; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; opacity: .8; }
    @media (max-width: 520px) {
      .tag { display: none; }
      .top { min-height: 49px; }
      .bottom { min-height: 60px; }
      .status small { font-size: 10px; }
      .coords { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Shadow Realms game">
    <header class="top">
      <div class="brand">
        <strong>Shadow Realms</strong>
        <span class="tag" id="stage-label">STAGE 1 · MAP TEST</span>
      </div>
      <div class="top-actions"><a class="back" href="/game" id="back-link">‹ Game</a></div>
    </header>

    <section class="map-area" aria-label="Battlefield">
      <canvas id="game" aria-label="Three-quarter-view world map"></canvas>
      <nav class="zoom-panel" aria-label="Camera controls">
        <button class="control" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="control" id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="control home" id="reset-camera" type="button" aria-label="Return to starting position">⌂</button>
      </nav>
      <div id="game-error" class="error" role="alert">
        <strong id="error-title">មិនអាចបើកផែនទីបាន</strong>
        <p id="error-message"></p>
        <pre id="error-details"></pre>
      </div>
    </section>

    <!-- Temporary status dock. The complete Battle Realms-style footer is a later module. -->
    <footer class="bottom">
      <div class="status">
        <strong id="status-title">ផែនទីកំពុងដំណើរការ</strong>
        <small id="status-hint">PC: WASD ដើម្បីរំកិល · Mouse Wheel ដើម្បី Zoom · Mobile: អូស / ម្រាមដៃពីរ</small>
      </div>
      <output class="coords" id="camera-position" aria-label="Camera position">—</output>
    </footer>
  </main>

  <script>
    // The game is intentionally local-only. These labels do not load network content.
    const labels = {
      km: { back: '‹ ហ្គេម', status: 'ផែនទីកំពុងដំណើរការ', hint: 'PC: WASD រំកិល · Wheel ពង្រីក · Mobile: អូស / ម្រាមដៃពីរ', fail: 'មិនអាចបើកផែនទីបាន', serve: 'ត្រូវបើកឯកសារនេះតាម Game URL របស់វេបសាយ (HTTP/HTTPS)។ JavaScript Modules មិនដំណើរការត្រឹមត្រូវពេលបើក file:// ផ្ទាល់ទេ។' },
      en: { back: '‹ Games', status: 'World map running', hint: 'PC: WASD pan · Wheel zoom · Mobile: drag / pinch', fail: 'Unable to load the map', serve: 'Open this file from your game site using HTTP/HTTPS. JavaScript modules may be blocked when opening file:// directly.' },
      zh: { back: '‹ 游戏', status: '地图运行中', hint: '电脑：WASD 移动 · 滚轮缩放 · 手机：拖动/双指缩放', fail: '无法加载地图', serve: '请通过网站的 HTTP/HTTPS 游戏地址打开。直接打开 file:// 可能会阻止 JavaScript 模块。' },
      ja: { back: '‹ ゲーム', status: 'マップ起動中', hint: 'PC：WASD移動・ホイール拡大・スマホ：ドラッグ/ピンチ', fail: 'マップを読み込めません', serve: 'サイトの HTTP/HTTPS アドレスから開いてください。file:// からは JavaScript モジュールが動作しない場合があります。' },
      ko: { back: '‹ 게임', status: '지도가 실행 중입니다', hint: 'PC: WASD 이동 · 휠 확대 · 모바일: 드래그/핀치', fail: '지도를 열 수 없습니다', serve: 'HTTP/HTTPS 게임 주소로 열어 주세요. file:// 직접 열기에서는 JavaScript 모듈이 차단될 수 있습니다.' },
    };
    const shortLang = (navigator.language || 'km').toLowerCase().split('-')[0];
    const lang = labels[shortLang] ? shortLang : 'km';
    const tr = labels[lang];
    document.documentElement.lang = lang;
    document.getElementById('back-link').textContent = tr.back;
    document.getElementById('status-title').textContent = tr.status;
    document.getElementById('status-hint').textContent = tr.hint;
    document.getElementById('error-title').textContent = tr.fail;
    window.showGameError = function (error) {
      document.getElementById('game-error').classList.add('show');
      document.getElementById('error-message').textContent = location.protocol === 'file:' ? tr.serve : tr.fail;
      document.getElementById('error-details').textContent = String(error?.message || error || '');
    };
    window.addEventListener('error', event => {
      if (!window.shadowRealmsGame) window.showGameError(event.message);
    });
    window.addEventListener('unhandledrejection', event => {
      if (!window.shadowRealmsGame) window.showGameError(event.reason);
    });
    if (location.protocol === 'file:') window.showGameError(tr.serve);
  </script>
  <script type="module">
    import { GameEngine } from './core/GameEngine.js';

    try {
      const game = new GameEngine({ canvas: document.getElementById('game') });
      game.start(); // No Start button: map appears immediately.
      window.shadowRealmsGame = game; // Useful for local browser debugging only.

      const zoomIn = document.getElementById('zoom-in');
      const zoomOut = document.getElementById('zoom-out');
      const reset = document.getElementById('reset-camera');
      const coords = document.getElementById('camera-position');
      const camera = game.camera;

      function zoom(factor) {
        camera.zoomAt(camera.zoom * factor);
        document.getElementById('game').focus({ preventScroll: true });
      }
      zoomIn.addEventListener('click', () => zoom(1.18));
      zoomOut.addEventListener('click', () => zoom(1 / 1.18));
      reset.addEventListener('click', () => {
        camera.zoomAt(1);
        const point = game.map.getSpawnPoint('blue');
        camera.centerOn(point.x, point.y);
      });

      // A very lightweight status readout: no separate animation loop or requests.
      let previous = '';
      const originalUpdate = game.onUpdate;
      game.onUpdate = (dt, instance) => {
        originalUpdate?.(dt, instance);
        const state = `${Math.round(camera.x)} · ${Math.round(camera.y)} · ${Math.round(camera.zoom * 100)}%`;
        if (state !== previous) {
          coords.textContent = state;
          previous = state;
        }
      };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) game.stop();
        else if (!game.destroyed) game.start();
      });
      window.addEventListener('pagehide', () => game.destroy(), { once: true });
    } catch (error) {
      window.showGameError(error);
      console.error('Shadow Realms startup:', error);
    }
  </script>
</body>
</html>
